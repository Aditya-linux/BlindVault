[package]
name = "pulse_call"
version = "0.1.0"
description = "Pulse Call — binary price calls on MagicBlock ER (Devnet)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pulse_call"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-attribute-account = "=1.1.2"
anchor-attribute-error = "=1.1.2"
anchor-attribute-event = "=1.1.2"
anchor-attribute-constant = "=1.1.2"
anchor-attribute-access-control = "=1.1.2"
anchor-attribute-program = "=1.1.1"
anchor-derive-accounts = "=1.1.2"
anchor-derive-serde = "=1.1.2"
anchor-derive-space = "=1.1.2"
anchor-syn = "=1.1.2"
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor", "vrf"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

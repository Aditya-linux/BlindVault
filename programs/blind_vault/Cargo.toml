[package]
name = "blind_vault"
version = "0.1.0"
description = "Blind Vault — Storage Wars on Solana with MagicBlock PER + VRF"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "blind_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2" }
# Pin with sealed-auction; VRF via 0.18 if needed — start without forcing 0.20
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor", "access-control"] }
sha2 = "0.10"

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          set +e
          npm install --legacy-peer-deps --no-fund --no-audit
          code=$?
          if [ $code -ne 0 ]; then
            echo "---- npm debug log ----"
            log=$(ls -1t "$HOME"/.npm/_logs/*debug*.log 2>/dev/null | head -1)
            if [ -n "$log" ]; then tail -n 120 "$log"; fi
            exit $code
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/blind_vault
      - name: Unit tests (host)
        run: cargo test -p blind_vault --manifest-path programs/blind_vault/Cargo.toml
